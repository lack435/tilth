name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # `--locked` here mirrors what the release matrix enforces with
      # `cargo build --release --locked`. Without it, a PR that changes dependencies but
      # forgets to commit Cargo.lock passes CI — cargo just updates the lockfile in the
      # runner and throws it away — and the disagreement only surfaces at tag time, where
      # it fails five build jobs across three operating systems. This job already resolves
      # and downloads the dependency graph, so enforcing the lockfile costs nothing.
      #
      # `cargo fmt` above is left alone: it does not resolve dependencies, so it has no
      # lockfile to disagree with.
      #
      # `--all-targets` covers the test, example and bin targets, not just the lib. Without it the
      # pedantic config never reached anything behind `#[cfg(test)]`, so test code accumulated 87
      # warnings no gate could see — including a detached `///` block documenting the wrong item.
      #
      # Two halves are needed and neither is sufficient. `--all-targets` decides which targets are
      # *compiled*; `[lints.clippy]` in Cargo.toml decides which get the pedantic config. It lives
      # there rather than as `#![warn(..)]` in src/lib.rs because an inner attribute reaches only its
      # own crate root — with it in lib.rs, `--all-targets` compiled src/main.rs, tests/oracle.rs and
      # examples/* while pedantic reached none of them, and 23 further warnings hid there.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
      - uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # ratchet:nosborn/github-action-markdown-cli@v3.5.0
        with:
          files: prompts/ AGENTS.md
          config_file: .markdownlint.json
      - name: AGENTS.md is regenerated from prompts/
        # Re-running the regen script must be a no-op. If AGENTS.md drifts from
        # prompts/*.md (someone edited the markdown but forgot to re-run the
        # script), this step fails and surfaces the missing regen in the PR.
        run: bash ./scripts/regen-agents-md.sh && git diff --exit-code AGENTS.md
