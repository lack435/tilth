name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail fast if Cargo.toml and npm/package.json versions don't match the tag
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
      - name: Verify versions match tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          NPM_VER=$(node -p "require('./npm/package.json').version")
          echo "Tag: $TAG  Cargo: $CARGO_VER  npm: $NPM_VER"
          if [ "$CARGO_VER" != "$TAG" ]; then
            echo "::error::Cargo.toml version ($CARGO_VER) does not match tag ($TAG)"
            exit 1
          fi
          if [ "$NPM_VER" != "$TAG" ]; then
            echo "::error::npm/package.json version ($NPM_VER) does not match tag ($TAG)"
            exit 1
          fi

  build:
    needs: version-check
    permissions:
      contents: write # softprops/action-gh-release uploads release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Install cross for Linux targets (cross-compiles via Docker)
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # Build
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      # Package — unix
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../tilth-${{ matrix.target }}.tar.gz tilth
          cd ../../..

      # Package — windows
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../tilth-${{ matrix.target }}.zip tilth.exe
          cd ../../..

      # Upload to GitHub release.
      #
      # Assets only. DO NOT add `generate_release_notes` or a `body` here: this step runs once
      # per matrix target, and either input would rewrite the release body five times over —
      # `generate_release_notes` by appending a fresh "What's Changed" block each time (#117).
      # With neither input the action preserves the body `create-release` already set.
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # ratchet:softprops/action-gh-release@v3
        with:
          files: |
            tilth-*.tar.gz
            tilth-*.zip

  # After all builds, write the release notes — exactly once.
  #
  # The notes cannot be generated in `build`: that job is a matrix, so its upload step runs
  # once per target, and `generate_release_notes: true` against an already-existing release
  # *appends* another generated block rather than replacing the body. Five targets meant five
  # "What's Changed" sections on every release (#117), and the count tracked the matrix, so
  # adding a target made it worse.
  #
  # This runs after the matrix rather than before it so that the release object is still first
  # created by a build job, with an asset attached. `install.sh` resolves the download URL
  # through `releases/latest`, so a release published ahead of the matrix would leave every
  # platform 404ing for the whole build instead of just the targets still in flight.
  #
  # The notes are fetched explicitly and passed as `body` rather than via
  # `generate_release_notes: true`. `body` replaces on update, so re-running the workflow for a
  # tag rewrites the same notes; asking the action to generate them would append a second copy
  # and reintroduce the bug from a single job.
  release-notes:
    needs: build
    permissions:
      contents: write # writes the release body
    runs-on: ubuntu-latest
    steps:
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > release-notes.md

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # ratchet:softprops/action-gh-release@v3
        with:
          body_path: release-notes.md

  # After all builds, publish to crates.io.
  #
  # Fork guard: this job publishes the `tilth` crate, a name this fork does not own,
  # so it must never run here. Gating on the upstream repository keeps the job inert
  # in every fork while leaving it untouched for upstream — a fork only needs the
  # `build` job, which attaches the per-target binaries to the GitHub release.
  publish-crate:
    needs: build
    if: github.repository == 'jahala/tilth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # After all builds, publish to npm.
  #
  # Fork guard: publishes the unscoped `tilth` package and the `@plotplot` scope,
  # neither of which this fork owns. Same gate as `publish-crate` above.
  publish-npm:
    needs: build
    if: github.repository == 'jahala/tilth'
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no NPM_TOKEN needed; provenance is automatic.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (node 20 ships npm 10.x).
      - run: npm install -g npm@latest
      # Primary package: unscoped `tilth`
      - run: npm publish ./npm
      # Anchor the @plotplot org: dual-publish the SAME artifact as `@plotplot/tilth`.
      # Requires a trusted publisher for @plotplot/tilth configured on npmjs.com (one-time).
      # Best-effort: the unscoped `tilth` publish above is the canonical release, so a
      # failure here (e.g. the @plotplot trusted publisher isn't configured yet) must not
      # fail the release. continue-on-error keeps the job green; if it fails, publish the
      # scope manually when ready — `cd npm && npm pkg set name=@plotplot/tilth && npm publish --access public`.
      - name: Dual-publish under the @plotplot scope
        continue-on-error: true
        working-directory: ./npm
        run: |
          npm pkg set name=@plotplot/tilth
          npm publish --access public
